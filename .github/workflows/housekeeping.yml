# Source of truth for dynched-networks/mcx-android.
#
# It belongs in that repository at .github/workflows/housekeeping.yml; it is
# kept here, beside the release workflow it is the counterpart of, so changes
# are reviewed and versioned with the releases it prunes. It is deliberately
# NOT under .github/workflows here: a workflow in this repository would prune
# this repository's own releases, which is not what it is for.
name: Housekeeping

# The public releases repo only needs the last few installers, so this prunes
# it: every release beyond the newest three, and every tag that is not one of
# theirs, is deleted. It is manual on purpose - "Run workflow" from the
# Actions tab when the list gets long - and a workflow of its own, so
# publishing a release never waits on it or runs it by accident.
#
# It runs on the same self-hosted runner group as the release workflow. A
# group can hand out more than one operating system, so the first step rejects
# anything but Linux before the bash and GNU commands below can fail one at a
# time.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: housekeeping
  cancel-in-progress: false

jobs:
  prune:
    name: Delete all but the newest 3 releases and tags
    runs-on:
      group: generic
    timeout-minutes: 15
    steps:
      - name: Require a Linux runner
        if: runner.os != 'Linux'
        run: |
          echo "::error::This job needs a Linux runner, but the runner group sent it to ${{ runner.os }}. It uses bash and GNU tools (mapfile, sed, grep), so it cannot continue here."
          exit 1

      - name: Work out what to keep and what to delete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep=3
          work="$RUNNER_TEMP/housekeeping"
          rm -rf "$work"
          mkdir -p "$work"

          # One line per release: publish time, a tab, the tag name. Tag names
          # alone would be wrong the day a fix is published after a larger
          # version.
          #
          # publishedAt, not createdAt. Every release the mirror creates can
          # share one creation time (on dynched-networks/mcx-android they are
          # all 2026-11-13T19:22:44Z) while their publish times are days apart,
          # so creation time cannot tell the newest release from the oldest.
          # The tag name breaks ties, so the order is total and reproducible.
          # -R is not optional here: this job never checks anything out, and
          # without it gh tries to infer the repository from a local git remote
          # and stops with "fatal: not a git repository".
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,publishedAt,createdAt \
            --jq '.[] | [(.publishedAt // .createdAt // ""), .tagName] | @tsv' \
            > "$work/order.tsv"

          # Newest first, the order the releases page shows: sort ascending on
          # publish time and then tag name, and turn that around. ISO-8601 UTC
          # timestamps compare correctly as text in the C locale.
          LC_ALL=C sort -t $'\t' -k1,1 -k2,2 "$work/order.tsv" | tac \
            | cut -f2 > "$work/releases.txt"

          mapfile -t published < "$work/releases.txt"
          if [ "${#published[@]}" -gt 0 ]; then
            printf '%s\n' "${published[@]:0:$keep}" > "$work/keep.txt"
          else
            : > "$work/keep.txt"
          fi
          # Slicing past the end yields no words, and printf with a format but
          # no arguments still prints a line - so a short list would otherwise
          # leave one empty "release" to count and iterate over.
          if [ "${#published[@]}" -gt "$keep" ]; then
            printf '%s\n' "${published[@]:$keep}" > "$work/old-releases.txt"
          else
            : > "$work/old-releases.txt"
          fi

          # Safety check, before a single release is deleted: prove the ones
          # being kept are all newer than the ones being deleted. Trusting the
          # sort alone is what pruned the mirror backwards once - it kept the
          # three OLDEST and deleted every release published after them - so
          # the split is now checked instead of assumed. The oldest kept
          # publish time must be strictly later than the newest deleted one; a
          # kept and a deleted release sharing a timestamp cannot be proved
          # either way, and the run stops rather than guess.
          if [ -s "$work/old-releases.txt" ]; then
            keep_key="$(LC_ALL=C awk -F'\t' '
              NR == FNR { keep[$1] = 1; next }
              $2 in keep { if (min == "" || $1 < min) min = $1 }
              END { print min }
            ' "$work/keep.txt" "$work/order.tsv")"
            delete_key="$(LC_ALL=C awk -F'\t' '
              NR == FNR { old[$1] = 1; next }
              $2 in old { if (max == "" || $1 > max) max = $1 }
              END { print max }
            ' "$work/old-releases.txt" "$work/order.tsv")"

            if [ -z "$keep_key" ] || [ -z "$delete_key" ]; then
              echo "::error::Cannot compare the kept and deleted releases: a tag is missing from the release list. Nothing was deleted."
              exit 1
            fi
            if ! LC_ALL=C awk -v kept="$keep_key" -v deleted="$delete_key" \
                 'BEGIN { exit !(deleted < kept) }'; then
              echo "::error::Refusing to prune: the newest release it would delete ($delete_key) is not older than the oldest release it would keep ($keep_key). The release order cannot be trusted, so nothing was deleted. Check the releases page before running this again."
              exit 1
            fi
            echo "Ordering check passed: newest deleted $delete_key is older than oldest kept $keep_key."
          fi

          # Every tag, so one whose release was deleted by hand does not
          # survive as an orphan. matching-refs also returns peeled refs
          # (name^{}) for annotated tags; those are not real tag names.
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" \
            --jq '.[].ref' \
            | sed -n 's#^refs/tags/##p' \
            | grep -v '\^{}$' > "$work/tags.txt" || true

          : > "$work/old-tags.txt"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if ! grep -Fxq "$tag" "$work/keep.txt"; then
              printf '%s\n' "$tag" >> "$work/old-tags.txt"
            fi
          done < "$work/tags.txt"

          {
            echo "### Keeping"
            if [ -s "$work/keep.txt" ]; then
              sed 's/^/- /' "$work/keep.txt"
            else
              echo "- nothing yet"
            fi
            echo
            if [ -n "${delete_key:-}" ]; then
              echo "Ordering check: newest deleted $delete_key is older than oldest kept $keep_key."
            else
              echo "Ordering check: nothing to delete."
            fi
            echo
            echo "Deleting $(wc -l < "$work/old-releases.txt" | tr -d ' ') old releases and $(wc -l < "$work/old-tags.txt" | tr -d ' ') old tags."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Keeping:"
          cat "$work/keep.txt"

      # Releases first: --cleanup-tag takes each release's tag with it, so the
      # tag sweep below only has the leftovers to deal with.
      - name: Delete the old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/housekeeping"
          if [ ! -s "$work/old-releases.txt" ]; then
            echo "Nothing older than the newest three."
            exit 0
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting release $tag"
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < "$work/old-releases.txt"

      - name: Delete leftover tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/housekeeping"
          if [ ! -s "$work/old-tags.txt" ]; then
            echo "No leftover tags."
            exit 0
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            # The release step may already have taken it; that is the outcome
            # this step wants, not a failure.
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "$tag is already gone"
              continue
            fi
            echo "Deleting tag $tag"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          done < "$work/old-tags.txt"

      - name: Show what is left
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Releases left:"
          gh release list -R "$GITHUB_REPOSITORY" --limit 20
          echo "Tags left:"
          git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" \
            | sed 's#.*refs/tags/#  #' || true
